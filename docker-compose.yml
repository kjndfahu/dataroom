# Runs the whole product locally: database, S3-compatible storage, API and web.
#
#   docker compose up --build          # start everything
#   docker compose run --rm seed       # demo user, folder tree and sample PDFs
#   docker compose down -v             # stop and discard the data
#
# Nothing external is required — the credentials below are local-only defaults.
# To run against Supabase instead, override DATABASE_URL and the S3_* variables
# in a .env file next to this one.

name: dataroom

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dataroom
      POSTGRES_PASSWORD: dataroom
      POSTGRES_DB: dataroom
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataroom -d dataroom"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dataroom
      MINIO_ROOT_PASSWORD: dataroom-secret
    ports:
      # 9000 is the S3 API the browser uploads to; 9001 is the MinIO console.
      - "${STORAGE_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the private bucket once, then exits.
  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://storage:9000 dataroom dataroom-secret &&
      mc mb --ignore-existing local/dataroom &&
      mc anonymous set none local/dataroom &&
      echo 'bucket ready'
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://dataroom:dataroom@db:5432/dataroom}
      DIRECT_URL: ${DIRECT_URL:-postgresql://dataroom:dataroom@db:5432/dataroom}
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-me}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-7d}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      # What the browser must use: presigned URLs are signed for this host.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dataroom}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dataroom-secret}
      S3_BUCKET: ${S3_BUCKET:-dataroom}
      S3_URL_TTL: ${S3_URL_TTL:-900}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-52428800}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined at build time, so they are build args rather than env vars.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_MAX_FILE_SIZE: ${MAX_FILE_SIZE:-52428800}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

  # One-shot: `docker compose run --rm seed`
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["tools"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dataroom:dataroom@db:5432/dataroom}
      DIRECT_URL: ${DIRECT_URL:-postgresql://dataroom:dataroom@db:5432/dataroom}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dataroom}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dataroom-secret}
      S3_BUCKET: ${S3_BUCKET:-dataroom}
    command: pnpm db:seed

volumes:
  db-data:
  storage-data:
